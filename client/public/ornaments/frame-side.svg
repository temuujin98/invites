<!--
  Tileable side vine, used as a CSS mask with repeat-y.
  The stem leaves the tile at x=12 top and bottom, so stacked tiles join
  into one continuous vine with no seam.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 80" width="24" height="80">
  <g fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round">
    <path d="M12 0 C 17 12, 7 22, 12 34 C 17 46, 7 56, 12 68 C 15 74, 13 77, 12 80" />
    <path d="M13.5 9 C 18 7, 20 10, 18.5 13 C 16 15, 13.8 13, 13.5 9 Z" />
    <path d="M10.5 29 C 6 27, 4 30, 5.5 33 C 8 35, 10.2 33, 10.5 29 Z" />
    <path d="M13.5 49 C 18 47, 20 50, 18.5 53 C 16 55, 13.8 53, 13.5 49 Z" />
    <path d="M10.5 69 C 6 67, 4 70, 5.5 73 C 8 75, 10.2 73, 10.5 69 Z" />
  </g>
  <g fill="#000">
    <circle cx="12" cy="20" r="1.5" />
    <circle cx="12" cy="40" r="1.5" />
    <circle cx="12" cy="60" r="1.5" />
  </g>
</svg>
